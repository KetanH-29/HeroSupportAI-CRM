<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeroSupportAI — Agent Portal Login</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }

    .glass-card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen relative flex items-center justify-center p-4">

  <!-- Ambient Background -->
  <div class="fixed inset-0 pointer-events-none z-0">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(99,102,241,0.15)_0%,transparent_50%)]"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-slate-950/40 via-slate-950/80 to-slate-950"></div>
  </div>

  <div class="relative z-10 w-full max-w-md">

    <!-- Header Logo -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-3 mb-3 hover:opacity-90 transition-opacity">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 p-0.5 shadow-xl shadow-indigo-500/25 flex items-center justify-center">
          <i data-lucide="brain-circuit" class="w-6 h-6 text-white"></i>
        </div>
        <span class="text-2xl font-display font-bold tracking-tight text-white">HeroSupportAI</span>
      </a>
      <p class="text-xs text-slate-400 font-medium">Support Engineering & Analysis Portal</p>
    </div>

    <!-- Login Glass Card -->
    <div class="glass-card rounded-3xl p-7 sm:p-8 shadow-2xl border border-slate-800/80">

      <div class="mb-6">
        <h1 class="text-lg font-display font-bold text-white mb-1">Support Agent Access</h1>
        <p class="text-xs text-slate-400">Authenticate to access live tickets, ETL analytics, and AI analysis intelligence.</p>
      </div>

      <!-- Quick Demo Credentials Box for Recruiter -->
      <div class="mb-6 p-4 rounded-2xl bg-indigo-950/30 border border-indigo-500/20 text-xs">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[11px] font-mono font-bold text-indigo-300 uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-indigo-400"></i>
            Evaluator Demo Account
          </span>
          <button type="button" onclick="fillDemoCredentials()" class="text-[10px] font-mono text-indigo-400 hover:text-indigo-300 font-bold underline">
            Fill 1-Click
          </button>
        </div>
        <div class="font-mono text-[11px] text-slate-300 space-y-0.5">
          <div><span class="text-slate-500">Email:</span> agent@herosupport.ai</div>
          <div><span class="text-slate-500">Password:</span> agent123</div>
        </div>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Agent Work Email</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input type="email" id="email" required placeholder="agent@herosupport.ai"
                   class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input type="password" id="password" required placeholder="••••••••"
                   class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
          </div>
        </div>

        <!-- Error Message -->
        <div id="login-error" class="hidden p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-xs text-rose-400 flex items-center gap-2">
          <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
          <span id="error-text">Invalid credentials.</span>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submit-btn" class="w-full mt-2 py-3 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold text-xs transition-all shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span id="btn-text">Sign In to Command Center</span>
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-slate-800 text-center">
        <a href="/" class="text-xs text-slate-400 hover:text-slate-300 transition-colors inline-flex items-center gap-1.5">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span>Return to Customer Help Center</span>
        </a>
      </div>

    </div>

  </div>

  <script>
    lucide.createIcons();

    // Catch BFCache navigation when on login page
    window.addEventListener('pageshow', function (event) {
      // Clear inputs if coming back to login
      const form = document.getElementById('login-form');
      if (form) form.reset();
    });

    function fillDemoCredentials() {
      document.getElementById('email').value = 'agent@herosupport.ai';
      document.getElementById('password').value = 'agent123';
      const errorBox = document.getElementById('login-error');
      errorBox.classList.add('hidden');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const errorBox = document.getElementById('login-error');
      const errorText = document.getElementById('error-text');

      errorBox.classList.add('hidden');
      submitBtn.disabled = true;
      btnText.textContent = "Authenticating...";

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || 'Authentication failed');
        }

        // Store auth token in localStorage
        localStorage.setItem('herosupport_token', data.token);
        localStorage.setItem('herosupport_agent', JSON.stringify(data.agent));

        // Use location.replace so the login page doesn't remain in back-stack
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || '/dashboard';
        window.location.replace(redirect);

      } catch (err) {
        errorText.textContent = err.message;
        errorBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = "Sign In to Command Center";
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
